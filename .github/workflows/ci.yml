name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LIBTORCH_VERSION: "2.14.1"
  PYTHON_VERSION: "3.12"

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job A: Python tests + golden determinism
  # ═══════════════════════════════════════════════════════════════
  python-tests:
    name: Python Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Print environment
        run: |
          echo "=== OS ==="
          uname -a
          cat /etc/os-release | head -3
          echo "=== Python ==="
          python --version
          echo "=== Architecture ==="
          uname -m
          echo "=== Environment variables ==="
          env | grep -iE "python|torch|cuda|cmake|gcc|gxx" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install torch==${LIBTORCH_VERSION} --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(f'torch {torch.__version__} OK')"

      - name: Install XorZen (no-deps to preserve torch)
        run: |
          python -m pip install --no-deps -e .
          python -m pip install numpy pydantic psutil einops tqdm scipy sentencepiece tokenizers transformers

      - name: Verify import
        run: |
          python -c "import xorzen; print(f'xorzen imported OK, version={xorzen.__version__}')"

      - name: Run golden determinism test
        run: |
          python tests/test_golden_parity.py

      - name: Run SSM scan parity
        run: |
          python tests/test_ssm_scan_parity.py

      - name: Run beam search regression
        run: |
          python tests/test_beam_search.py

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-logs
          path: |
            tests/*.json
            tests/*.log

  # ═══════════════════════════════════════════════════════════════
  # Job B: C++ parity harnesses (build + test)
  # ═══════════════════════════════════════════════════════════════
  cpp-parity:
    name: C++ Parity Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Print environment
        run: |
          echo "=== OS ==="
          uname -a
          echo "=== Compiler ==="
          g++ --version | head -1
          echo "=== Python ==="
          python --version
          echo "=== Architecture ==="
          uname -m

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyTorch (for Python fixture generation)
        run: |
          python -m pip install torch==${LIBTORCH_VERSION} --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(f'torch {torch.__version__} OK')"

      - name: Verify LibTorch from pip torch
        run: |
          TORCH_DIR=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')
          echo "TORCH_DIR=$TORCH_DIR"
          echo "=== Check lib ==="
          ls -la $TORCH_DIR/lib/libtorch.so || { echo "ERROR: libtorch.so not found"; exit 1; }
          echo "=== Check include ==="
          ls -la $TORCH_DIR/include/torch/ 2>&1 | head -5
          ls -la $TORCH_DIR/include/torch/csrc/api/include/torch/nn.h || { echo "ERROR: nn.h not found"; exit 1; }
          echo "=== Check for torch.h ==="
          if [ ! -f "$TORCH_DIR/include/torch/torch.h" ]; then
            echo "torch.h not found — creating symlink to torch/csrc/api/include"
            # The pip torch has C++ API headers under include/torch/csrc/api/include
            # but not the main torch.h umbrella. We create a wrapper.
            mkdir -p /tmp/torch_include/torch
            ln -sf $TORCH_DIR/include/torch/csrc/api/include/torch/* /tmp/torch_include/torch/
            ln -sf $TORCH_DIR/include/torch /tmp/torch_include/torch_full
            ln -sf $TORCH_DIR/include/ATen /tmp/torch_include/ATen
            ln -sf $TORCH_DIR/include/c10 /tmp/torch_include/c10
            echo "Created /tmp/torch_include with symlinks"
            ls /tmp/torch_include/torch/ | head -10
          fi
          echo "LibTorch verified from pip torch"

      - name: Verify LibTorch headers exist
        run: |
          TORCH_DIR=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')
          echo "TORCH_DIR=$TORCH_DIR"
          ls -la $TORCH_DIR/lib/libtorch.so || { echo "ERROR: libtorch.so not found"; exit 1; }
          ls $TORCH_DIR/include/torch/csrc/api/include/torch/nn.h || { echo "ERROR: nn.h not found"; exit 1; }
          echo "LibTorch headers and libraries verified from pip torch."

      - name: Install XorZen (for fixture generation)
        run: |
          python -m pip install --no-deps -e .
          python -m pip install numpy pydantic psutil einops tqdm scipy pyyaml

      - name: Generate fixtures
        run: |
          python tests/cpp_parity/generators/generate_all_fixtures.py
          python tests/cpp_parity/generators/write_simple_manifest.py

      - name: Build C++ parity harness
        run: |
          cd tests/cpp_parity/cpp
          ./build.sh
          ls -la parity_harness

      - name: Run component parity tests
        run: |
          export LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')/lib:$LD_LIBRARY_PATH
          python tests/cpp_parity/compare.py

      - name: Build and run extended SSM tests
        run: |
          export LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')/lib:$LD_LIBRARY_PATH
          python tests/cpp_parity/test_extended_ssm.py

      - name: Build and run training smoke test
        run: |
          export LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')/lib:$LD_LIBRARY_PATH
          TORCH_DIR=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')
          g++ -std=c++20 -O2 \
            -I$TORCH_DIR/include -I$TORCH_DIR/include/torch/csrc/api/include \
            -L$TORCH_DIR/lib tests/cpp_parity/cpp/training_smoke_test.cpp \
            -ltorch -lc10 -ltorch_cpu -Wl,-rpath,$TORCH_DIR/lib \
            -o tests/cpp_parity/cpp/training_smoke_test
          python tests/cpp_parity/generators/generate_full_model_fixture.py
          ./tests/cpp_parity/cpp/training_smoke_test tests/cpp_parity/fixtures/15_full_model tests/cpp_parity/cpp_output/training_smoke

      - name: Build and run generation test
        run: |
          export LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')/lib:$LD_LIBRARY_PATH
          TORCH_DIR=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')
          g++ -std=c++20 -O2 \
            -I$TORCH_DIR/include -I$TORCH_DIR/include/torch/csrc/api/include \
            -L$TORCH_DIR/lib tests/cpp_parity/cpp/generation_test.cpp \
            -ltorch -lc10 -ltorch_cpu -Wl,-rpath,$TORCH_DIR/lib \
            -o tests/cpp_parity/cpp/generation_test
          ./tests/cpp_parity/cpp/generation_test tests/cpp_parity/fixtures/15_full_model tests/cpp_parity/cpp_output/generation

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-parity-logs
          path: |
            tests/cpp_parity/reports/
            tests/cpp_parity/cpp_output/

  # ═══════════════════════════════════════════════════════════════
  # Job C: Python package import test
  # ═══════════════════════════════════════════════════════════════
  python-import:
    name: Python Package Import
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Print environment
        run: |
          echo "=== OS ==="
          uname -a
          echo "=== Python ==="
          python --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyTorch (CPU)
        run: |
          python -m pip install torch==${LIBTORCH_VERSION} --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(f'torch {torch.__version__} OK')"

      - name: Install XorZen package
        run: |
          python -m pip install --no-deps -e .
          python -m pip install numpy pydantic psutil einops tqdm scipy sentencepiece tokenizers transformers

      - name: Import test
        run: |
          python -c "import xorzen; print(f'xorzen version: {xorzen.__version__}'); from xorzen.models.zero import zero_tiny_23k; import torch; torch.manual_seed(42); m = zero_tiny_23k(test_mode=False); m.eval(); x = torch.randint(0, 8, (1, 4)); out = m(input_ids=x, return_dict=True); print(f'forward OK: logits shape={out.logits.shape}'); print('IMPORT TEST PASS')"

  # ═══════════════════════════════════════════════════════════════
  # Job D: Integration — Python → checkpoint → C++ → inference
  # ═══════════════════════════════════════════════════════════════
  integration:
    name: Integration (Python → C++ → inference)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    needs: [python-tests, cpp-parity]
    steps:
      - uses: actions/checkout@v4

      - name: Print environment
        run: |
          echo "=== OS ==="
          uname -a
          echo "=== Compiler ==="
          g++ --version | head -1
          echo "=== Python ==="
          python --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyTorch + deps
        run: |
          python -m pip install torch==${LIBTORCH_VERSION} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e .
          python -m pip install numpy pydantic psutil einops tqdm scipy sentencepiece tokenizers transformers

      - name: Verify LibTorch from pip torch
        run: |
          TORCH_DIR=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')
          echo "TORCH_DIR=$TORCH_DIR"
          ls -la $TORCH_DIR/lib/libtorch.so || { echo "ERROR: libtorch.so not found"; exit 1; }
          ls $TORCH_DIR/include/torch/csrc/api/include/torch/nn.h || { echo "ERROR: nn.h not found"; exit 1; }
          echo "LibTorch verified from pip torch"

      - name: Generate full-model fixture
        run: |
          python tests/cpp_parity/generators/generate_full_model_fixture.py

      - name: Convert checkpoint
        run: |
          python tests/cpp_parity/convert_checkpoint.py \
            tests/cpp_parity/fixtures/15_full_model/state_dict.pt \
            tests/cpp_parity/checkpoints/zero_tiny_23k_cpp.pt \
            --report tests/cpp_parity/reports/integration_conversion.json

      - name: Build and run real model forward parity
        run: |
          export LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')/lib:$LD_LIBRARY_PATH
          TORCH_DIR=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')
          BUILD_DIR=tests/cpp_parity/cpp/build
          mkdir -p "$BUILD_DIR"
          # Build the real model library
          # Use -mavx2 -mfma for SIMD support (simd_ops.cpp requires AVX2)
          MODEL_CXXFLAGS="-std=c++20 -O2 -fPIC -mavx2 -mfma -I$TORCH_DIR/include -I$TORCH_DIR/include/torch/csrc/api/include -Ixorzen.cpp/include"
          for f in xorzen.cpp/src/model/variants.cpp xorzen.cpp/src/utils/math_utils.cpp \
                   xorzen.cpp/src/utils/logger.cpp xorzen.cpp/src/optimized/simd_ops.cpp \
                   xorzen.cpp/src/optimized/thread_pool.cpp xorzen.cpp/src/core/tensor_utils.cpp \
                   xorzen.cpp/src/model/expert.cpp xorzen.cpp/src/model/ssm.cpp \
                   xorzen.cpp/src/model/merger.cpp xorzen.cpp/src/model/cot_vector.cpp \
                   xorzen.cpp/src/model/igris.cpp xorzen.cpp/src/model/coherence_field.cpp \
                   xorzen.cpp/src/model/routing.cpp xorzen.cpp/src/model/hass_block.cpp \
                   xorzen.cpp/src/model/zmoe.cpp xorzen.cpp/src/model/xorzen_model.cpp; do
            echo "Compiling $(basename $f)..."
            g++ $MODEL_CXXFLAGS -c "$f" -o "$BUILD_DIR/$(basename ${f%.cpp}).o" || {
              echo "ERROR: Failed to compile $f"
              exit 1
            }
          done
          ar rcs "$BUILD_DIR/libxorzen_model.a" "$BUILD_DIR"/*.o
          echo "Library built: $(ls -la $BUILD_DIR/libxorzen_model.a | awk '{print $5}') bytes"
          # Build and run real model test (forward mode)
          g++ -std=c++20 -O2 -fPIC -I$TORCH_DIR/include -I$TORCH_DIR/include/torch/csrc/api/include \
            -Ixorzen.cpp/include tests/cpp_parity/cpp/real_model_test.cpp \
            "$BUILD_DIR/libxorzen_model.a" \
            -L$TORCH_DIR/lib -ltorch -lc10 -ltorch_cpu -Wl,-rpath,$TORCH_DIR/lib \
            -o tests/cpp_parity/cpp/real_model_test
          ./tests/cpp_parity/cpp/real_model_test tests/cpp_parity/fixtures/15_full_model \
            tests/cpp_parity/cpp_output/integration_real_model forward

      - name: Upload integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            tests/cpp_parity/reports/
            tests/cpp_parity/cpp_output/
