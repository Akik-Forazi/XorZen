name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v1.0.1)'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: write

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Python package (pure Python — no compilation needed)
  # ═══════════════════════════════════════════════════════════════
  python-package:
    name: Python Package
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install build wheel

      - name: Build package
        run: |
          python -m build
          ls -la dist/

      - name: Install torch (CPU) for verification
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pydantic psutil einops tqdm scipy sentencepiece tokenizers transformers

      - name: Verify package (no-deps install to preserve torch)
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "import xorzen; print(f'xorzen {xorzen.__version__} OK')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════
  # Job 2: C++ model library + parity harness (per platform)
  # ═══════════════════════════════════════════════════════════════
  cpp-build:
    name: C++ Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyTorch + deps
        shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pydantic psutil einops tqdm scipy pyyaml

      - name: Install xorzen
        shell: bash
        run: python -m pip install --no-deps -e .

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build C++ model library (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')/lib:$LD_LIBRARY_PATH
          TORCH_DIR=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')
          BUILD_DIR=tests/cpp_parity/cpp/build
          mkdir -p "$BUILD_DIR"

          # Detect compiler + AVX2
          CXX=g++
          AVX_FLAGS=""
          if [ "$(uname -s)" = "Darwin" ]; then
            CXX=clang++
          elif [ "$(uname -m)" = "x86_64" ] && [ "$(uname -s)" = "Linux" ]; then
            AVX_FLAGS="-mavx2 -mfma"
          fi

          CXXFLAGS="-std=c++20 -O2 -fPIC $AVX_FLAGS -I$TORCH_DIR/include -I$TORCH_DIR/include/torch/csrc/api/include -Ixorzen.cpp/include"

          # Build model library (16 sources)
          for f in xorzen.cpp/src/model/variants.cpp xorzen.cpp/src/utils/math_utils.cpp \
                   xorzen.cpp/src/utils/logger.cpp xorzen.cpp/src/optimized/simd_ops.cpp \
                   xorzen.cpp/src/optimized/thread_pool.cpp xorzen.cpp/src/core/tensor_utils.cpp \
                   xorzen.cpp/src/model/expert.cpp xorzen.cpp/src/model/ssm.cpp \
                   xorzen.cpp/src/model/merger.cpp xorzen.cpp/src/model/cot_vector.cpp \
                   xorzen.cpp/src/model/igris.cpp xorzen.cpp/src/model/coherence_field.cpp \
                   xorzen.cpp/src/model/routing.cpp xorzen.cpp/src/model/hass_block.cpp \
                   xorzen.cpp/src/model/zmoe.cpp xorzen.cpp/src/model/xorzen_model.cpp; do
            echo "  CC $(basename $f)"
            $CXX $CXXFLAGS -c "$f" -o "$BUILD_DIR/$(basename ${f%.cpp}).o" || { echo "ERROR: $f"; exit 1; }
          done
          ar rcs "$BUILD_DIR/libxorzen_model.a" "$BUILD_DIR"/*.o

          # Build parity harness (standalone, no model lib)
          $CXX $CXXFLAGS tests/cpp_parity/cpp/parity_harness.cpp \
            -L$TORCH_DIR/lib -ltorch -lc10 -ltorch_cpu -Wl,-rpath,$TORCH_DIR/lib \
            -o tests/cpp_parity/cpp/parity_harness

          # Build real model test
          $CXX $CXXFLAGS tests/cpp_parity/cpp/real_model_test.cpp \
            "$BUILD_DIR/libxorzen_model.a" \
            -L$TORCH_DIR/lib -ltorch -lc10 -ltorch_cpu -Wl,-rpath,$TORCH_DIR/lib \
            -o tests/cpp_parity/cpp/real_model_test

          echo "Build complete."

      - name: Build C++ model library (Windows MSVC — lightning /MP parallel)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TORCH_DIR=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')
          BUILD_DIR=tests/cpp_parity/cpp/build
          mkdir -p "$BUILD_DIR"

          echo "=== MSVC Lightning Build: 16 sources in ONE cl call, /MP parallelizes across all cores ==="

          # MSVC flags: /MP = multi-process parallel compile, /O2 = optimize, /arch:AVX2 = SIMD
          # /D__AVX2__ enables the manual AVX2 intrinsic path in simd_ops.cpp
          CXXFLAGS="/std:c++20 /O2 /arch:AVX2 /D__AVX2__ /MP /EHsc /MD /utf-8 /nologo /Gm- -I$TORCH_DIR/include -I$TORCH_DIR/include/torch/csrc/api/include -Ixorzen.cpp/include"

          # Single cl invocation — /MP compiles all 16 sources in parallel
          cl /c $CXXFLAGS \
            xorzen.cpp/src/model/variants.cpp \
            xorzen.cpp/src/utils/math_utils.cpp \
            xorzen.cpp/src/utils/logger.cpp \
            xorzen.cpp/src/optimized/simd_ops.cpp \
            xorzen.cpp/src/optimized/thread_pool.cpp \
            xorzen.cpp/src/core/tensor_utils.cpp \
            xorzen.cpp/src/model/expert.cpp \
            xorzen.cpp/src/model/ssm.cpp \
            xorzen.cpp/src/model/merger.cpp \
            xorzen.cpp/src/model/cot_vector.cpp \
            xorzen.cpp/src/model/igris.cpp \
            xorzen.cpp/src/model/coherence_field.cpp \
            xorzen.cpp/src/model/routing.cpp \
            xorzen.cpp/src/model/hass_block.cpp \
            xorzen.cpp/src/model/zmoe.cpp \
            xorzen.cpp/src/model/xorzen_model.cpp \
            /Fo:"$BUILD_DIR/"

          # Create static library
          lib /nologo /OUT:"$BUILD_DIR/xorzen_model.lib" "$BUILD_DIR/"*.obj

          # Build parity harness (compile + link)
          cl $CXXFLAGS tests/cpp_parity/cpp/parity_harness.cpp \
            /link /OUT:"tests/cpp_parity/cpp/parity_harness.exe" \
            /LIBPATH:"$TORCH_DIR/lib" torch.lib c10.lib torch_cpu.lib

          # Build real model test (compile + link)
          cl $CXXFLAGS tests/cpp_parity/cpp/real_model_test.cpp \
            /link /OUT:"tests/cpp_parity/cpp/real_model_test.exe" \
            "$BUILD_DIR/xorzen_model.lib" \
            /LIBPATH:"$TORCH_DIR/lib" torch.lib c10.lib torch_cpu.lib

          echo "=== Windows MSVC build complete ==="

      - name: Smoke test — parity harness
        shell: bash
        run: |
          TORCH_DIR=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$TORCH_DIR/lib:$PATH"
          else
            export LD_LIBRARY_PATH="$TORCH_DIR/lib:$LD_LIBRARY_PATH"
          fi
          python tests/cpp_parity/generators/generate_all_fixtures.py
          python tests/cpp_parity/generators/write_simple_manifest.py
          python tests/cpp_parity/compare.py

      - name: Smoke test — real model forward parity
        shell: bash
        run: |
          TORCH_DIR=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="$TORCH_DIR/lib:$PATH"
          else
            export LD_LIBRARY_PATH="$TORCH_DIR/lib:$LD_LIBRARY_PATH"
          fi
          python tests/cpp_parity/generators/generate_full_model_fixture.py
          ./tests/cpp_parity/cpp/real_model_test tests/cpp_parity/fixtures/15_full_model \
            tests/cpp_parity/cpp_output/release_test forward

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xorzen-cpp-${{ matrix.platform }}
          path: |
            tests/cpp_parity/cpp/build/libxorzen_model.a
            tests/cpp_parity/cpp/build/xorzen_model.lib
            tests/cpp_parity/cpp/parity_harness
            tests/cpp_parity/cpp/parity_harness.exe
            tests/cpp_parity/cpp/real_model_test
            tests/cpp_parity/cpp/real_model_test.exe
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Publish GitHub Release (only on tag push)
  # ═══════════════════════════════════════════════════════════════
  publish-release:
    name: Publish GitHub Release
    needs: [python-package, cpp-build]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.python-package.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: List all artifacts
        run: |
          echo "=== Artifact tree ==="
          find release-assets/ -type f | sort
          echo "=== Sizes ==="
          du -sh release-assets/*/ | sort -h

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XorZen ${{ github.ref_name }}
          body: |
            # XorZen ${{ github.ref_name }}

            ## Artifacts

            ### Python Package
            - `python-package/xorzen-*.whl` — Pure-Python wheel (install with `pip install xorzen-*.whl`)

            ### C++ Libraries
            - `xorzen-cpp-linux-x64/libxorzen_model.a` — Linux x86_64 static library
            - `xorzen-cpp-macos-arm64/libxorzen_model.a` — macOS ARM64 (Apple Silicon) static library
            - `xorzen-cpp-windows-x64/xorzen_model.lib` — Windows x86_64 static library (MSVC)
            - Each platform also includes `parity_harness` and `real_model_test` binaries

            ## Installation

            ### Python
            ```bash
            pip install xorzen  # from PyPI (when published)
            # OR from this release:
            pip install ./xorzen-*.whl
            ```

            ### C++ (Linux/macOS)
            ```bash
            # Download libxorzen_model.a for your platform
            g++ -std=c++20 -O2 -Ixorzen.cpp/include your_app.cpp \
                -L. -lxorzen_model \
                -ltorch -lc10 -ltorch_cpu -o your_app
            ```

            ### C++ (Windows MSVC)
            ```cmd
            :: Download xorzen_model.lib
            cl /std:c++20 /O2 /EHsc /MD /Ixorzen.cpp/include your_app.cpp \
                xorzen_model.lib torch.lib c10.lib torch_cpu.lib /Fe:your_app.exe
            ```

            ## Verification

            All artifacts are built and tested on GitHub-hosted runners.
            The C++ libraries pass forward-parity against the Python reference
            (max logit diff ≤ 1e-7).

            ## Changes

            See [commit history](https://github.com/Akik-Forazi/XorZen/commits/${{ github.ref_name }})
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            release-assets/python-package/*
            release-assets/xorzen-cpp-linux-x64/*
            release-assets/xorzen-cpp-macos-arm64/*
            release-assets/xorzen-cpp-windows-x64/*

  # ═══════════════════════════════════════════════════════════════
  # Job 4: Summary (always runs, reports status)
  # ═══════════════════════════════════════════════════════════════
  release-summary:
    name: Release Summary
    runs-on: ubuntu-22.04
    needs: [python-package, cpp-build, publish-release]
    if: always()
    steps:
      - name: Print build results
        run: |
          echo "=== Release Build Summary ==="
          echo "Python package:       ${{ needs.python-package.result }}"
          echo "C++ build:            ${{ needs.cpp-build.result }}"
          echo "Publish release:      ${{ needs.publish-release.result }}"
          echo ""
          if [ "${{ needs.python-package.result }}" = "success" ] && [ "${{ needs.cpp-build.result }}" = "success" ]; then
            echo "ALL RELEASE BUILDS PASSED"
            if [ "${{ needs.publish-release.result }}" = "success" ]; then
              echo "GITHUB RELEASE PUBLISHED: ${{ github.ref_name }}"
            elif [ "${{ needs.publish-release.result }}" = "skipped" ]; then
              echo "(publish-release skipped — not a tag push)"
            fi
          else
            echo "SOME BUILDS FAILED — check artifacts"
          fi
