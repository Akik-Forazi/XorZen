name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Python package (pure Python — no compilation needed)
  # ═══════════════════════════════════════════════════════════════
  python-package:
    name: Python Package
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: python -m pip install build wheel

      - name: Build package
        run: |
          python -m build
          ls -la dist/

      - name: Verify package
        run: |
          python -m pip install dist/*.whl
          python -c "import xorzen; print(f'xorzen {xorzen.__version__} OK')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  # ═══════════════════════════════════════════════════════════════
  # Job 2: C++ model library + parity harness (per platform)
  # ═══════════════════════════════════════════════════════════════
  cpp-build:
    name: C++ Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-13
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyTorch + deps
        shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pydantic psutil einops tqdm scipy pyyaml

      - name: Install xorzen
        shell: bash
        run: python -m pip install --no-deps -e .

      - name: Build C++ model library + parity harness
        shell: bash
        run: |
          export LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')/lib:$LD_LIBRARY_PATH
          TORCH_DIR=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')
          BUILD_DIR=tests/cpp_parity/cpp/build
          mkdir -p "$BUILD_DIR"

          # Detect compiler + AVX2
          CXX=g++
          AVX_FLAGS=""
          if [ "$(uname -s)" = "Darwin" ]; then
            CXX=clang++
          elif [ "$(uname -m)" = "x86_64" ]; then
            AVX_FLAGS="-mavx2 -mfma"
          fi

          CXXFLAGS="-std=c++20 -O2 -fPIC $AVX_FLAGS -I$TORCH_DIR/include -I$TORCH_DIR/include/torch/csrc/api/include -Ixorzen.cpp/include"

          # Build model library (16 sources)
          for f in xorzen.cpp/src/model/variants.cpp xorzen.cpp/src/utils/math_utils.cpp \
                   xorzen.cpp/src/utils/logger.cpp xorzen.cpp/src/optimized/simd_ops.cpp \
                   xorzen.cpp/src/optimized/thread_pool.cpp xorzen.cpp/src/core/tensor_utils.cpp \
                   xorzen.cpp/src/model/expert.cpp xorzen.cpp/src/model/ssm.cpp \
                   xorzen.cpp/src/model/merger.cpp xorzen.cpp/src/model/cot_vector.cpp \
                   xorzen.cpp/src/model/igris.cpp xorzen.cpp/src/model/coherence_field.cpp \
                   xorzen.cpp/src/model/routing.cpp xorzen.cpp/src/model/hass_block.cpp \
                   xorzen.cpp/src/model/zmoe.cpp xorzen.cpp/src/model/xorzen_model.cpp; do
            echo "  CC $(basename $f)"
            $CXX $CXXFLAGS -c "$f" -o "$BUILD_DIR/$(basename ${f%.cpp}).o" || { echo "ERROR: $f"; exit 1; }
          done
          ar rcs "$BUILD_DIR/libxorzen_model.a" "$BUILD_DIR"/*.o

          # Build parity harness (standalone, no model lib)
          $CXX $CXXFLAGS tests/cpp_parity/cpp/parity_harness.cpp \
            -L$TORCH_DIR/lib -ltorch -lc10 -ltorch_cpu -Wl,-rpath,$TORCH_DIR/lib \
            -o tests/cpp_parity/cpp/parity_harness

          # Build real model test
          $CXX $CXXFLAGS tests/cpp_parity/cpp/real_model_test.cpp \
            "$BUILD_DIR/libxorzen_model.a" \
            -L$TORCH_DIR/lib -ltorch -lc10 -ltorch_cpu -Wl,-rpath,$TORCH_DIR/lib \
            -o tests/cpp_parity/cpp/real_model_test

          echo "Build complete."

      - name: Smoke test — parity harness
        shell: bash
        run: |
          export LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')/lib:$LD_LIBRARY_PATH
          python tests/cpp_parity/generators/generate_all_fixtures.py
          python tests/cpp_parity/generators/write_simple_manifest.py
          python tests/cpp_parity/compare.py

      - name: Smoke test — real model forward parity
        shell: bash
        run: |
          export LD_LIBRARY_PATH=$(python -c 'import torch; print(torch.__file__.rsplit("/",1)[0])')/lib:$LD_LIBRARY_PATH
          python tests/cpp_parity/generators/generate_full_model_fixture.py
          ./tests/cpp_parity/cpp/real_model_test tests/cpp_parity/fixtures/15_full_model \
            tests/cpp_parity/cpp_output/release_test forward

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xorzen-cpp-${{ matrix.platform }}
          path: |
            tests/cpp_parity/cpp/build/libxorzen_model.a
            tests/cpp_parity/cpp/parity_harness
            tests/cpp_parity/cpp/real_model_test
          retention-days: 90

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Summary (always runs, reports status)
  # ═══════════════════════════════════════════════════════════════
  release-summary:
    name: Release Summary
    runs-on: ubuntu-22.04
    needs: [python-package, cpp-build]
    if: always()
    steps:
      - name: Print build results
        run: |
          echo "=== Release Build Summary ==="
          echo "Python package: ${{ needs.python-package.result }}"
          echo "C++ build: ${{ needs.cpp-build.result }}"
          echo ""
          if [ "${{ needs.python-package.result }}" = "success" ] && [ "${{ needs.cpp-build.result }}" = "success" ]; then
            echo "ALL RELEASE BUILDS PASSED"
          else
            echo "SOME BUILDS FAILED — check artifacts"
          fi
