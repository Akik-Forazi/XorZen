name: Build Native Kernels

on:
  push:
    branches: [main]
    paths:
      - 'xorzen/speed/csrc/**'
      - 'xorzen.cpp/src/**'
      - 'xorzen.cpp/include/**'
      - '.github/workflows/build-native-kernels.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: Build Python native kernels via load_inline
  # ═══════════════════════════════════════════════════════════════
  python-kernels:
    name: Python Kernels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Print environment
        shell: bash
        run: |
          echo "=== OS ==="
          uname -a 2>/dev/null || ver
          echo "=== Python ==="
          python --version 2>&1 || python3 --version 2>&1
          echo "=== Compiler ==="
          g++ --version 2>/dev/null | head -1 || clang++ --version 2>/dev/null | head -1 || echo "MSVC"
          echo "=== Architecture ==="
          uname -m 2>/dev/null || echo "x86_64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyTorch + deps
        shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pyyaml scipy sentencepiece transformers tqdm \
                      einops pydantic psutil tokenizers ninja

      - name: Install xorzen
        shell: bash
        run: python -m pip install --no-deps -e .

      - name: Verify torch + compiler
        shell: bash
        run: |
          python -c "import torch; print(f'torch {torch.__version__} OK')"
          TORCH_DIR=$(python -c 'import torch, os; print(os.path.dirname(torch.__file__).replace(chr(92), "/"))')
          echo "TORCH_DIR=$TORCH_DIR"
          # Check for libtorch — different filenames per platform
          ls "$TORCH_DIR/lib/libtorch.so" 2>/dev/null && echo "Found libtorch.so" || true
          ls "$TORCH_DIR/lib/libtorch.dylib" 2>/dev/null && echo "Found libtorch.dylib" || true
          ls "$TORCH_DIR/lib/torch.lib" 2>/dev/null && echo "Found torch.lib" || true
          ls "$TORCH_DIR/lib/" 2>/dev/null | head -10 || true

      - name: Compile native kernels
        shell: bash
        continue-on-error: true
        id: compile_kernels
        env:
          XORZEN_BUILD_VERBOSE: '1'
        run: |
          python -c "
          import sys, os
          sys.path.insert(0, '.')
          from xorzen.speed.native_kernels import _try_compile, get_native_status
          _try_compile()
          status = get_native_status()
          print(f'Native available: {status[\"available\"]}')
          if status['error']:
              print(f'Warning: {status[\"error\"]}')
              print('Native kernels are optional — model works without them.')
              sys.exit(0)  # Don't fail the job
          print('Compilation successful!')
          "

      - name: Test native kernels
        shell: bash
        continue-on-error: true
        run: |
          python -c "
          import sys, torch
          sys.path.insert(0, '.')
          from xorzen.speed.native_kernels import (
              native_available, get_native_status
          )
          print(f'Native available: {native_available}')
          status = get_native_status()
          if not native_available:
              print('Native kernels not compiled — skipping tests.')
              sys.exit(0)
          if status['error']:
              print(f'Error: {status[\"error\"]}')
              sys.exit(0)

          from xorzen.speed.native_kernels import fused_rmsnorm, fused_gelu, fused_swiglu
          x = torch.randn(4, 64)
          gamma = torch.ones(64)
          out = fused_rmsnorm(x, gamma, eps=1e-6)
          assert out.shape == x.shape
          print('  fused_rmsnorm: PASS')

          out2 = fused_gelu(x)
          assert out2.shape == x.shape
          ref = torch.nn.functional.gelu(x)
          max_diff = (out2 - ref).abs().max().item()
          assert max_diff < 0.01, f'GELU diff too large: {max_diff}'
          print(f'  fused_gelu: PASS (max_diff={max_diff:.6f})')

          up = torch.randn(4, 64)
          out3 = fused_swiglu(x, up)
          assert out3.shape == x.shape
          ref3 = torch.nn.functional.silu(x) * up
          max_diff3 = (out3 - ref3).abs().max().item()
          assert max_diff3 < 0.01, f'SwiGLU diff too large: {max_diff3}'
          print(f'  fused_swiglu: PASS (max_diff={max_diff3:.6f})')

          print('ALL NATIVE KERNEL TESTS PASSED')
          "

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xorzen-kernels-${{ matrix.platform }}
          path: |
            ~/.cache/torch_extensions/
            ~/.local/cache/torch_extensions/
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════
  # Job 2: Build C++ model library (using same approach as ci.yml)
  # ═══════════════════════════════════════════════════════════════
  cpp-model:
    name: C++ Model (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Print environment
        shell: bash
        run: |
          echo "=== OS ==="
          uname -a
          echo "=== Compiler ==="
          g++ --version 2>/dev/null | head -1 || clang++ --version 2>/dev/null | head -1 || echo "MSVC (Windows)"
          echo "=== Python ==="
          python3 --version 2>&1 || python --version 2>&1
          echo "=== Architecture ==="
          uname -m
          echo "=== Runner OS ==="
          echo "$RUNNER_OS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install PyTorch (provides LibTorch headers + libs)
        shell: bash
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch; print(f'torch {torch.__version__} OK')"

      - name: Verify LibTorch
        shell: bash
        run: |
          TORCH_DIR=$(python -c 'import torch, os; print(os.path.dirname(torch.__file__).replace(chr(92), "/"))')
          echo "TORCH_DIR=$TORCH_DIR"
          # Check for shared/static lib (platform-specific)
          ls "$TORCH_DIR/lib/libtorch.so" 2>/dev/null && echo "Found libtorch.so" || true
          ls "$TORCH_DIR/lib/libtorch.dylib" 2>/dev/null && echo "Found libtorch.dylib" || true
          ls "$TORCH_DIR/lib/torch.lib" 2>/dev/null && echo "Found torch.lib" || true
          ls "$TORCH_DIR/include/torch/csrc/api/include/torch/nn.h" 2>/dev/null || {
            echo "WARNING: nn.h not found, but continuing..."
          }
          echo "LibTorch verified"

      - name: Build C++ model library (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export LD_LIBRARY_PATH=$(python -c 'import torch, os; print(os.path.dirname(torch.__file__).replace(chr(92), "/"))')/lib:$LD_LIBRARY_PATH
          TORCH_DIR=$(python -c 'import torch, os; print(os.path.dirname(torch.__file__).replace(chr(92), "/"))')
          BUILD_DIR=tests/cpp_parity/cpp/build
          mkdir -p "$BUILD_DIR"

          # Detect compiler and AVX2 support
          CXX=g++
          AVX_FLAGS=""
          if [ "$(uname -s)" = "Darwin" ]; then
            CXX=clang++
          elif [ "$(uname -m)" = "x86_64" ] && [ "$(uname -s)" = "Linux" ]; then
            AVX_FLAGS="-mavx2 -mfma"
          fi

          MODEL_CXXFLAGS="-std=c++20 -O2 -fPIC $AVX_FLAGS -I$TORCH_DIR/include -I$TORCH_DIR/include/torch/csrc/api/include -Ixorzen.cpp/include"

          echo "=== Using $CXX with flags: $MODEL_CXXFLAGS ==="
          echo "=== Compiling 16 model sources ==="
          for f in xorzen.cpp/src/model/variants.cpp xorzen.cpp/src/utils/math_utils.cpp \
                   xorzen.cpp/src/utils/logger.cpp xorzen.cpp/src/optimized/simd_ops.cpp \
                   xorzen.cpp/src/optimized/thread_pool.cpp xorzen.cpp/src/core/tensor_utils.cpp \
                   xorzen.cpp/src/model/expert.cpp xorzen.cpp/src/model/ssm.cpp \
                   xorzen.cpp/src/model/merger.cpp xorzen.cpp/src/model/cot_vector.cpp \
                   xorzen.cpp/src/model/igris.cpp xorzen.cpp/src/model/coherence_field.cpp \
                   xorzen.cpp/src/model/routing.cpp xorzen.cpp/src/model/hass_block.cpp \
                   xorzen.cpp/src/model/zmoe.cpp xorzen.cpp/src/model/xorzen_model.cpp; do
            echo "  CC $(basename $f)"
            $CXX $MODEL_CXXFLAGS -c "$f" -o "$BUILD_DIR/$(basename ${f%.cpp}).o" || {
              echo "ERROR: Failed to compile $f"
              exit 1
            }
          done

          ar rcs "$BUILD_DIR/libxorzen_model.a" "$BUILD_DIR"/*.o
          echo "Library: $(ls -la $BUILD_DIR/libxorzen_model.a | awk '{print $5}') bytes"

      - name: Build C++ model library (Windows MSVC — lightning /MP parallel)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TORCH_DIR=$(python -c 'import torch, os; print(os.path.dirname(torch.__file__).replace(chr(92), "/"))')
          BUILD_DIR=tests/cpp_parity/cpp/build
          mkdir -p "$BUILD_DIR"

          echo "=== MSVC Lightning Build: 16 sources in ONE cl call, /MP parallelizes across all cores ==="

          CXXFLAGS="/std:c++20 /O2 /arch:AVX2 /D__AVX2__ /MP /EHsc /MD /utf-8 /nologo /Gm- -I$TORCH_DIR/include -I$TORCH_DIR/include/torch/csrc/api/include -Ixorzen.cpp/include"

          cl /c $CXXFLAGS \
            xorzen.cpp/src/model/variants.cpp \
            xorzen.cpp/src/utils/math_utils.cpp \
            xorzen.cpp/src/utils/logger.cpp \
            xorzen.cpp/src/optimized/simd_ops.cpp \
            xorzen.cpp/src/optimized/thread_pool.cpp \
            xorzen.cpp/src/core/tensor_utils.cpp \
            xorzen.cpp/src/model/expert.cpp \
            xorzen.cpp/src/model/ssm.cpp \
            xorzen.cpp/src/model/merger.cpp \
            xorzen.cpp/src/model/cot_vector.cpp \
            xorzen.cpp/src/model/igris.cpp \
            xorzen.cpp/src/model/coherence_field.cpp \
            xorzen.cpp/src/model/routing.cpp \
            xorzen.cpp/src/model/hass_block.cpp \
            xorzen.cpp/src/model/zmoe.cpp \
            xorzen.cpp/src/model/xorzen_model.cpp \
            /Fo:"$BUILD_DIR/"

          lib /nologo /OUT:"$BUILD_DIR/xorzen_model.lib" "$BUILD_DIR/"*.obj
          echo "Library: $(ls -la $BUILD_DIR/xorzen_model.lib | awk '{print $5}') bytes"

      - name: Build and run real model forward parity (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export LD_LIBRARY_PATH=$(python -c 'import torch, os; print(os.path.dirname(torch.__file__).replace(chr(92), "/"))')/lib:$LD_LIBRARY_PATH
          TORCH_DIR=$(python -c 'import torch, os; print(os.path.dirname(torch.__file__).replace(chr(92), "/"))')
          BUILD_DIR=tests/cpp_parity/cpp/build

          CXX=g++
          AVX_FLAGS=""
          if [ "$(uname -s)" = "Darwin" ]; then
            CXX=clang++
          elif [ "$(uname -m)" = "x86_64" ] && [ "$(uname -s)" = "Linux" ]; then
            AVX_FLAGS="-mavx2 -mfma"
          fi

          # Install xorzen for fixture generation
          python -m pip install --no-deps -e .
          python -m pip install numpy pydantic psutil einops tqdm scipy pyyaml

          # Generate fixture
          python tests/cpp_parity/generators/generate_full_model_fixture.py

          # Build real model test
          $CXX -std=c++20 -O2 -fPIC $AVX_FLAGS \
            -I$TORCH_DIR/include -I$TORCH_DIR/include/torch/csrc/api/include \
            -Ixorzen.cpp/include tests/cpp_parity/cpp/real_model_test.cpp \
            "$BUILD_DIR/libxorzen_model.a" \
            -L$TORCH_DIR/lib -ltorch -lc10 -ltorch_cpu -Wl,-rpath,$TORCH_DIR/lib \
            -o tests/cpp_parity/cpp/real_model_test

          # Run forward parity
          ./tests/cpp_parity/cpp/real_model_test tests/cpp_parity/fixtures/15_full_model \
            tests/cpp_parity/cpp_output/native_build_test forward

      - name: Build and run real model forward parity (Windows MSVC)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          TORCH_DIR=$(python -c 'import torch, os; print(os.path.dirname(torch.__file__).replace(chr(92), "/"))')
          BUILD_DIR=tests/cpp_parity/cpp/build

          # Install xorzen for fixture generation
          python -m pip install --no-deps -e .
          python -m pip install numpy pydantic psutil einops tqdm scipy pyyaml

          # Generate fixture
          python tests/cpp_parity/generators/generate_full_model_fixture.py

          # Build real model test (compile + link)
          CXXFLAGS="/std:c++20 /O2 /arch:AVX2 /D__AVX2__ /EHsc /MD /utf-8 /nologo -I$TORCH_DIR/include -I$TORCH_DIR/include/torch/csrc/api/include -Ixorzen.cpp/include"
          cl $CXXFLAGS tests/cpp_parity/cpp/real_model_test.cpp \
            /link /OUT:"tests/cpp_parity/cpp/real_model_test.exe" \
            "$BUILD_DIR/xorzen_model.lib" \
            /LIBPATH:"$TORCH_DIR/lib" torch.lib c10.lib torch_cpu.lib

          # Run forward parity (add torch DLLs to PATH)
          export PATH="$TORCH_DIR/lib:$PATH"
          ./tests/cpp_parity/cpp/real_model_test tests/cpp_parity/fixtures/15_full_model \
            tests/cpp_parity/cpp_output/native_build_test forward

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xorzen-cpp-model-${{ matrix.platform }}
          path: |
            tests/cpp_parity/cpp/build/libxorzen_model.a
            tests/cpp_parity/cpp/build/xorzen_model.lib
            tests/cpp_parity/cpp_output/
          retention-days: 30
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════
  # Job 3: Summary (always runs, reports status)
  # Note: GitHub Releases are published by release.yml on tag push.
  # ═══════════════════════════════════════════════════════════════
  build-summary:
    name: Native Build Summary
    needs: [python-kernels, cpp-model]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Print build results
        run: |
          echo "=== Native Kernels Build Summary ==="
          echo "Python kernels: ${{ needs.python-kernels.result }}"
          echo "C++ model:      ${{ needs.cpp-model.result }}"
          echo ""
          if [ "${{ needs.python-kernels.result }}" = "success" ] && [ "${{ needs.cpp-model.result }}" = "success" ]; then
            echo "ALL NATIVE BUILD JOBS PASSED"
          else
            echo "SOME NATIVE BUILD JOBS FAILED — check artifacts"
          fi
          echo ""
          echo "Note: GitHub Releases are published by release.yml on tag push (v*)."
